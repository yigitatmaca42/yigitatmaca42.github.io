<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07080b">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png?v=20260927b">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png?v=20260927b">
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=20260927b">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png?v=20260927b">
    <link rel="manifest" href="site.webmanifest">
    <title>404 — Yiğit Atmaca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .error-page {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-6);
        }

        .error-code {
            font-family: var(--font-mono);
            font-size: clamp(4rem, 16vw, 8rem);
            font-weight: 700;
            color: var(--text);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .error-route {
            font-family: var(--font-mono);
            color: var(--accent-text);
            margin: var(--space-4) 0 var(--space-2);
            font-size: var(--text-md);
        }

        .error-page p {
            max-width: 46ch;
            margin-bottom: var(--space-6);
        }
    </style>
</head>
<body>
    <main class="error-page">
        <a href="index.html" class="brand" style="margin-bottom: var(--space-7);" aria-label="Anasayfa">
            <img src="assets/images/favicon.png?v=20260927b" alt="" width="30" height="30">
            TYA <span class="brand-tag">Cyber</span>
        </a>
        <div class="error-code">404</div>
        <p class="error-route mono">Route not found.</p>
        <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Belki de bu, çözülmemiş bir challenge'dır.</p>
        <div class="hero-actions">
            <a href="index.html" class="btn btn-primary">Ana Sayfaya Dön</a>
            <a href="contact.html" class="btn btn-ghost">İletişime Geç</a>
        </div>
    </main>
</body>
</html>
